name = "tru-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Origins allowed to call this gateway. Anything else is refused before the key is touched.
[vars]
ALLOWED_ORIGINS = "https://forevercrab321-svg.github.io,http://localhost:3000,http://localhost:4000"

# Audit log and rate-limit buckets. Create with:
#   npx wrangler kv namespace create AUDIT
# then uncomment and paste the id wrangler prints.
# [[kv_namespaces]]
# binding = "AUDIT"
# id = "<paste it here>"

# SECRETS — never in this file, never in git:
#   npx wrangler secret put KIMI_API_KEY
#   npx wrangler secret put SESSION_SECRET
