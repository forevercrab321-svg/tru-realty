name = "tru-ai-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Origins allowed to call this gateway. Anything else is refused before the key is touched.
[vars]
ALLOWED_ORIGINS = "https://forevercrab321-svg.github.io,http://localhost:3000,http://localhost:4000"

# Lets POST /session mint a session from the demo roster with no password check.
# Correct for a demo over seeded data. Set to "false" the moment real records exist,
# and set REAL_DATA = "true", which refuses the endpoint outright.
DEMO_SESSIONS = "true"
REAL_DATA = "false"

# A Kimi key is valid in exactly one of three places, and they do not overlap. All three
# issue `sk-` keys, so a key from the wrong one 401s in a way that reads as "bad key":
#
#   https://api.moonshot.ai/v1       pay-as-you-go, keys from platform.kimi.ai
#   https://api.moonshot.cn/v1       pay-as-you-go, keys from platform.moonshot.cn
#   https://api.kimi.com/coding/v1   a Kimi Code / membership SUBSCRIPTION — billed against
#                                    the monthly plan quota rather than per token
#
# GET /health probes all three at once and tells you which one your key belongs to.
KIMI_BASE_URL = "https://api.kimi.com/coding/v1"

# Model ids belong to the endpoint, not to the app. The pay-as-you-go platforms call it
# `kimi-k3`; the subscription endpoint calls the same model `k3`. Also there:
# `kimi-for-coding`, `kimi-for-coding-highspeed`. /health lists what your key can see.
KIMI_MODEL = "k3"

# api.kimi.com sits behind bot protection that 403s a request with no User-Agent and
# answers with an HTML challenge page — which looks nothing like an auth failure. If
# /health reports HTML in a response body, try the UA the official client sends.
KIMI_USER_AGENT = "kimi-cli/1.0"

# Audit log and rate-limit buckets. Created with:
#   npx wrangler kv namespace create AUDIT
# A namespace id is not a secret — it is useless without account credentials — so it
# belongs in the config rather than in a secret.
[[kv_namespaces]]
binding = "AUDIT"
id = "e94c2c5a968544528b9400874cf12a70"

# SECRETS — never in this file, never in git:
#   npx wrangler secret put KIMI_API_KEY
#   npx wrangler secret put SESSION_SECRET
